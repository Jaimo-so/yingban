<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <title>影伴 · 一张电影分享</title>
    <link rel="stylesheet" href="/styles.css?v=15">
  </head>
  <body class="share-page">
    <main class="public-share-shell">
      <header class="public-share-header">
        <a class="brand" href="/" aria-label="影伴首页"><span class="brand-mark" aria-hidden="true">映</span><span>影伴</span></a>
        <div class="public-share-actions">
          <span>一份可以慢慢翻看的电影月刊</span>
          <a class="share-back-button" href="/"><span aria-hidden="true">←</span> 返回影伴</a>
        </div>
      </header>
      <div id="public-share-loading" class="public-share-loading" role="status">正在放映这张电影分享…</div>
      <article id="public-share-card" class="share-artifact" aria-live="polite" hidden></article>
    </main>
    <script src="/share-card.js?v=12" defer></script>
    <script src="/share.js?v=12" defer></script>
  </body>
</html>
